  <g filter="url(#s)" font-family="Arial,sans-serif"><rect x="66" y="104" width="186" height="84" rx="18" fill="#fff"/><rect x="548" y="104" width="186" height="84" rx="18" fill="#fff"/><rect x="66" y="329" width="186" height="84" rx="18" fill="#fff"/><rect x="548" y="329" width="186" height="84" rx="18" fill="#fff"/></g>
  <g font-family="Arial,sans-serif"><circle cx="96" cy="134" r="12" fill="#e5efff"/><path d="M91 134h10m-5-5v10" stroke="#2b4dff" stroke-width="2"/><text x="118" y="137" font-size="13" font-weight="700" fill="#273764">Data protection</text><text x="91" y="164" font-size="11" fill="#78839a">Access • retention • retrieval</text><circle cx="578" cy="134" r="12" fill="#f0eaff"/><path d="m574 134 3 3 6-7" fill="none" stroke="#7752e9" stroke-width="2"/><text x="600" y="137" font-size="13" font-weight="700" fill="#273764">Quality evaluation</text><text x="573" y="164" font-size="11" fill="#78839a">Grounding • safety • task fit</text><circle cx="96" cy="359" r="12" fill="#e9f8f4"/><path d="M91 359h10m-5-5v10" stroke="#1fa78c" stroke-width="2"/><text x="118" y="362" font-size="13" font-weight="700" fill="#273764">Identity controls</text><text x="91" y="389" font-size="11" fill="#78839a">Roles • secrets • boundaries</text><circle cx="578" cy="359" r="12" fill="#fff2e4"/><path d="M573 364v-7l5-3 5 3v7" fill="none" stroke="#e49b31" stroke-width="2"/><text x="600" y="362" font-size="13" font-weight="700" fill="#273764">Operations</text><text x="573" y="389" font-size="11" fill="#78839a">Monitor • release • respond</text></g>
  <g fill="none" stroke="#96a6c2" stroke-width="2" stroke-dasharray="4 5"><path d="M252 164 322 209M548 164 478 209M252 371l70-45m226 0 70 45"/></g><text x="400" y="467" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5b6780">Readiness is a system, not just a model</text>
