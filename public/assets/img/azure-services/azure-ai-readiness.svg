<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Azure AI production-readiness assessment</title><desc id="desc">An AI service is surrounded by data protection, evaluation, identity, and monitoring controls.</desc>
