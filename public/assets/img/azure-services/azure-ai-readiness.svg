  <rect width="800" height="520" rx="34" fill="url(#bg)"/><circle cx="400" cy="257" r="177" fill="none" stroke="#dce5f7" stroke-width="2" stroke-dasharray="6 8"/><circle cx="400" cy="257" r="132" fill="none" stroke="#e3dcfa" stroke-width="2"/>
