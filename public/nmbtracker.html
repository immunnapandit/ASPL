el.innerHTML=`<div class="tools"><input type="search" placeholder="Search by ID, requirement or owner"><select>${"<option value=''>All statuses</option>"+ST.map(s=>`<option>${s}</option>`).join("")}</select><select><option value="">All owners</option>${o.map(a=>`<option>${esc(a)}</option>`).join("")}</select>${allCat?`<select data-k="c"><option value="">All categories</option>${C.map(c=>`<option value="${c.type}">${esc(c.name)}</option>`).join("")}</select>`:""}${new Set(x.map(i=>i.dom)).size>1?`<select data-k="m"><option value="">All workstreams</option>${[...new Set(x.map(i=>i.dom))].sort().map(a=>`<option>${esc(a)}</option>`).join("")}</select>`:""}</div><div class="ls"></div>`;
const [q,s,w]=el.querySelectorAll("input,select"),c=el.querySelector('[data-k="c"]'),m=el.querySelector('[data-k="m"]'),L=el.querySelector(".ls");
const dr=()=>{const y=x.filter(i=>(!s.value||i.status===s.value)&&(!w.value||i.owner===w.value)&&(!c||!c.value||i.cat===c.value)&&(!m||!m.value||i.dom===m.value)&&(!q.value||(i.id+" "+i.name+" "+i.owner+" "+i.dom).toLowerCase().includes(q.value.toLowerCase())));L.innerHTML=`<p class=sub>${y.length} of ${x.length} items</p>`+y.map(item).join("")};
el.querySelectorAll("input,select").forEach(e=>e.addEventListener("input",dr));dr()}
const attn=x=>{const a=x.filter(i=>i.status==="Blocked"||i.status==="Delayed");return a.length?tb(["ID","Requirement","Blocker / reason","Waiting on","Owner","Target","Status"],a.map(i=>[esc(i.id),esc(i.name),esc(i.blocker)||"—",esc(i.wait)||"—",esc(i.owner)||"—",fd(i.target)+(i.over>0?`<div class=sub>${i.over} working days overdue</div>`:""),bd(i.status)])):"<p class=sub>No blocked or delayed items.</p>"};
const hpr=x=>{const a=x.filter(i=>/^(Critical|High)$/.test(i.prio)&&!/^(Completed|On Hold)$/.test(i.status));return a.length?tb(["ID","Requirement","Priority","Owner","Target","Status","~% complete"],a.map(i=>[esc(i.id),esc(i.name),esc(i.prio),esc(i.owner)||"—",fd(i.target),bd(i.status),pc(i.pct)])):"<p class=sub>None.</p>"};
function overview(){return`<div class="grid">${kp(I.length,"In-scope items")+kp(cnt(I,"Completed"),"Completed")+kp(cnt(I,"In Progress"),"In progress")+kp(cnt(I,"Blocked")+cnt(I,"Delayed"),"Blocked / delayed")+kp(pc(avg(I)),"Avg stage progress")+kp(pc(eT[4]),"Budget used")}</div>`+
sec("Status of items in scope",sbar(I))+"<h2>Categories (select one for detail)</h2><div class=two>"+C.map(c=>{const x=sel(c);return`<a class="card cc" href="#${slug(c.type)}"><b>${esc(c.name)}</b><div class=row><span class=l>${x.length} items · ${cnt(x,"Completed")} completed · ${cnt(x,"Blocked")} blocked</span><span>${pc(avg(x))}</span></div>${pb(avg(x))}<div class=row style="margin-top:10px"><span class=l>Actual / approved hrs</span><span>${f(c.act)} / ${f(c.appr)}</span></div><div class=row><span class=l>Est. to complete</span><span>${f(c.etc)} hrs</span></div></a>`}).join("")+"</div>"+"<h2>Sub-categories</h2><p class=sub>Each main category is split into sub-categories. All finance-related items are grouped under Finance Control and tax-related items (WHT, VAT, tax settlement) under Tax Control; open a main category above for its sub-category detail.</p><div class=card>"+mxTbl()+"</div>"+sec("Effort snapshot",tb(["Bucket","~Approved","~Consumed","~Remaining","Burn","Status"],D.eff.map(e=>[esc(e[0]),f(e[1]),f(e[2]),nf(e[3]),e[1]?pc(e[4])+pb(e[4],e[4]>1?"#d93a3a":""):"—",esc(e[5])])))+
sec("Items needing attention",attn(I))+sec("High-priority open items",hpr(I))}
const SGN=I[0].stages.map(g=>g[0]),cur=i=>{const k=i.stages.findIndex(g=>g[2]!=="Completed");return k<0?8:k},curN=i=>{const k=cur(i);return k>7?"Delivered":(k+1)+". "+SGN[k]};
const SO=["ASPL","NMB","ASPL","NMB","ASPL & NMB","ASPL","NMB","ASPL"],ACT=["Validate requirement","Review & sign off requirement / CR","Build solution","Validate in UAT","Complete functional testing & sign-off","Deploy to UAT","Approve production deployment","Deploy to production"];
const nxt=i=>{const k=cur(i);if(k>7)return null;let who=SO[k],rec=false;if(i.wait){rec=true;who=i.wait==="TBC"?"To be confirmed":i.wait}const g=i.stages[k];return{k,stage:(k+1)+". "+SGN[k],act:ACT[k],who,rec,st:g[2],p:g[1]}};
const whoT=n=>`${esc(n.who)}<div class=sub>${n.rec?"per tracker":"standard stage owner"}</div>`,stageT=n=>`${esc(n.stage)}<div class=sub>${n.st}${n.p?" · "+pc(n.p):""}</div>`;
const why=i=>i.blocker?esc(i.blocker):"No blocker recorded";
const wl=k=>k==="To be confirmed"?"Owner to be confirmed":"With "+k;
const OR=["NMB","ASPL","ASPL & NMB","Cybergen","Third party","To be confirmed"],SR=["Blocked","On Hold","In Progress","Not Started"];
const mini=y=>`<div class="bar" style="height:10px;min-width:70px">${ST.map(s=>{const n=cnt(y,s);return n?`<i title="${s}: ${n}" style="width:${n/y.length*100}%;background:${col[s]}"></i>`:""}).join("")}</div>`;
const lg=`<div class="leg">${ST.map(s=>`<span><s style="--c:${col[s]}"></s>${s}</span>`).join("")}</div>`;
const grp=(x,k)=>{const o={};x.forEach(i=>{const v=i[k]||"To be confirmed";(o[v]=o[v]||[]).push(i)});return Object.entries(o).sort((a,b)=>b[1].length-a[1].length)};
function category(c){const x=sel(c),n=x.length,isI=c.type==="Issue",dn=isI?"Resolved":"Delivered",done=cnt(x,"Completed"),prog=cnt(x,"In Progress"),d0=new Date(D.date+"T00:00:00");
const open=x.filter(i=>i.status!=="Completed").sort((a,b)=>SR.indexOf(a.status)-SR.indexOf(b.status)||b.pct-a.pct),blk=open.filter(i=>/^(Blocked|On Hold)$/.test(i.status)),dl=x.filter(i=>i.status==="Completed");
const by={};open.forEach(i=>{const w=nxt(i).who;(by[w]=by[w]||[]).push(i)});const ow=[...OR.filter(k=>by[k]),...Object.keys(by).filter(k=>!OR.includes(k))];
const msg=`<b>${done} of ${n}</b> ${c.name.toLowerCase()} ${dn.toLowerCase()} (${pc(n?done/n:0)}). ${prog} in progress, ${cnt(x,"Not Started")} not started${blk.length?`, ${blk.length} blocked or on hold`:""}. Average progress across the eight delivery stages is <b>${pc(avg(x))}</b>.`;
const pl=[...SGN.map((s,k)=>[(k+1)+". "+s,x.filter(i=>cur(i)===k)]),["Delivered",x.filter(i=>cur(i)===8)]];
const dys=i=>i.start?Math.round((d0-new Date(i.start+"T00:00:00"))/864e5):"—",hd=isI?["~Days open","Priority"]:[],cl=i=>isI?[dys(i),esc(i.prio)||"—"]:[];
const row=i=>{const t=nxt(i);return[esc(i.id),esc(i.name),esc(i.dom),bd(i.status),stageT(t),esc(t.act),whoT(t),why(i),esc(i.sme)||"—",...cl(i)]};
const H=["ID","Requirement","Sub-category","Status","Stage now","Next step","Next step with","Reason / note","NMB SME",...hd];
const nm=open.filter(i=>nxt(i).who==="NMB"),cc=open.filter(i=>i.status!=="Blocked"&&i.status!=="On Hold"&&i.pct>0).sort((a,b)=>b.pct-a.pct).slice(0,5);
let h=`<h2 style="margin-top:6px">${esc(c.name)}</h2><div class="card">${msg}</div><div class="grid" style="margin-top:12px">${kp(n,"Items in scope")+kp(done,dn)+kp(prog,"In progress")+kp(blk.length,"Blocked / on hold")+kp(pc(avg(x)),"Avg stage progress")}</div>`+sec("Status",sbar(x));
h+=`<h2>Who holds the next step</h2><div class="grid">${kp(open.length,"Open items")+ow.map(k=>kp(by[k].length,wl(k))).join("")}</div><p class=sub style="margin:8px 2px 0">“Per tracker” means the party recorded in the tracker's Waiting-on field. Otherwise the owner shown is the standard owner of the current delivery stage: NMB for requirement sign-off, UAT validation and production approval; ASPL for requirement validation, build, UAT deployment and production deployment; both for functional testing sign-off.</p>`;
h+="<h2>Needs NMB action</h2><div class=card>"+(nm.length?tb(["ID","Requirement","Action needed","Stage now","Reason / note","NMB SME"],nm.map(i=>{const t=nxt(i);return[esc(i.id),esc(i.name),esc(t.act),stageT(t),why(i),esc(i.sme)||"—"]})):"<p class=sub>Nothing is currently waiting on NMB.</p>")+"</div>";
h+="<h2>Why things are not progressing</h2><div class=card>"+(blk.length?`<p class=sub style="margin-top:0">${blk.length} item${blk.length>1?"s are":" is"} blocked or on hold: ${grp(blk,"wait").map(([k,v])=>(k==="TBC"?"owner to be confirmed":k)+" "+v.length).join(" · ")}. The other ${open.length-blk.length} open items have no blocker recorded in the tracker.</p>`+tb(["ID","Requirement","Status","Stage now","Held by","Reason","NMB SME"],blk.map(i=>{const t=nxt(i);return[esc(i.id),esc(i.name),bd(i.status),stageT(t),whoT(t),why(i),esc(i.sme)||"—"]})):"<p class=sub>Nothing is blocked or on hold. No blockers are recorded for the "+open.length+" open items.</p>")+"</div>";
h+=sec("Delivery pipeline: where items are today",pl.map(([l,y])=>`<div class=fun><span>${l}</span>${pb(n?y.length/n:0,l==="Delivered"?col.Completed:"")}<span>${y.length}</span></div>`).join("")+'<p class=sub style="margin:8px 0 0">An item sits at the first stage not yet completed.</p>');
h+=sec("By sub-category",tb(["Sub-category","~Items","Status mix","~Progress","~Done"],dm(x).map(k=>{const y=x.filter(i=>i.dom===k);return[esc(k),y.length,mini(y),pc(avg(y)),cnt(y,"Completed")]}))+lg);
if(isI)h+=sec("Issues by priority",tb(["Priority","~Issues","~Resolved","~Open","~% resolved"],["Critical","High","Medium","Low"].map(p=>{const y=x.filter(i=>i.prio===p);return[p,y.length,cnt(y,"Completed"),y.length-cnt(y,"Completed"),y.length?pc(cnt(y,"Completed")/y.length):"—"]})));
h+=sec("Closest to completion",cc.length?tb(["ID","Requirement","Sub-category","Stage now","~Progress"],cc.map(i=>[esc(i.id),esc(i.name),esc(i.dom),stageT(nxt(i)),pc(i.pct)+pb(i.pct)])):"<p class=sub>No open items have progressed beyond the start yet.</p>");
h+="<h2>All open items: stage, next step and owner</h2>"+ow.map(k=>{const y=by[k];return`<details class=gd ${y.length<=12?"open":""}><summary style="display:block;cursor:pointer;padding:12px 14px;font-weight:650">▸ ${esc(wl(k))} <span class=sub style="font-weight:400">· ${y.length} item${y.length>1?"s":""}</span></summary><div style="padding:0 12px 12px">${tb(H,y.map(row))}</div></details>`}).join("");
h+=`<h2>${dn}</h2><div class=card>`+(dl.length?tb(["ID","Requirement","Sub-category","NMB SME","Target"],dl.map(i=>[esc(i.id),esc(i.name),esc(i.dom),esc(i.sme)||"—",fd(i.target)])):`<p class=sub>Nothing ${dn.toLowerCase()} yet in this category; ${prog} item${prog==1?" is":"s are"} in progress.</p>`)+"</div>";
h+=sec("By NMB SME",tb(["NMB SME","~Items","~"+dn,"~In progress","~Blocked","Avg progress"],grp(x,"sme").map(([k,y])=>[esc(k),y.length,cnt(y,"Completed"),cnt(y,"In Progress"),cnt(y,"Blocked"),pc(avg(y))])));
h+=`<h2>Effort</h2><div class="grid">${kp(f(c.appr),"Approved hrs")+kp(f(c.act),"Actual hrs")+kp(f(c.etc),"Est. to complete hrs")+kp(f(c.rev),"Revised estimate hrs")}</div><h2>All ${esc(c.name.toLowerCase())}</h2><div id=ls></div>`;return h}

function effort(){const ph=PL.map((_,k)=>sum(C.map(c=>c.ph[k]))),mo={},ct={};D.ae.forEach(a=>{mo[a[0].slice(0,7)]=(mo[a[0].slice(0,7)]||0)+a[4];ct[a[1]]=(ct[a[1]]||0)+a[4]});
const kh=sum(D.kt.map(k=>k[3])),M=Object.keys(mo).sort().reverse();
return`<div class="grid">${D.eff.map(e=>kp(f(e[2])+(e[1]?" / "+f(e[1]):""),esc(e[0])+" hrs (used / approved)")).join("")}</div>`+
sec("Budget pools",tb(["Bucket","~Approved","~Consumed","~Remaining","Burn","Status"],D.eff.map(e=>[esc(e[0]),f(e[1]),f(e[2]),nf(e[3]),e[1]?pc(e[4])+pb(e[4],e[4]>1?"#d93a3a":""):"—",esc(e[5])])))+
sec("Delivery hours by category",tb(["Category","~Original est.","~Revised est.","~Approved","~Actual","~Balance","~Est. to complete"],C.map(c=>[`<a href="#${slug(c.type)}">${esc(c.name)}</a>`,f(c.orig),f(c.rev),f(c.appr),f(c.act),nf(c.bal),f(c.etc)]).concat([["<b>Total</b>",f(sum(C,"orig")),f(sum(C,"rev")),f(sum(C,"appr")),f(sum(C,"act")),nf(sum(C,"bal")),f(sum(C,"etc"))]])))+
sec("Delivery hours by phase",stk(ph,PL,PC," hrs"))+
`<div class=two><div>${sec("Additional efforts by month (hrs)",tb(["Month","~Hours"],M.map(m=>[mon(m+"-01"),f(mo[m])])))}</div><div>${sec("Additional efforts by type (hrs)",tb(["Type","~Hours"],Object.keys(ct).map(k=>[esc(k),f(ct[k])])))}</div></div>`+
sec("Additional efforts log ("+D.ae.length+" entries)",tb(["Date","Type","Activity","~People","~Person-hrs"],D.ae.map(a=>[fd(a[0]),esc(a[1]),esc(a[2]),a[3],f(a[4])])))+
sec("Knowledge transfer sessions ("+f(kh)+" hrs)",tb(["Date","Topic","~People","~Person-hrs","Status"],D.kt.map(k=>[fd(k[0]),esc(k[1]),k[2],f(k[3]),esc(k[4])||"—"])))}
const T=[["overview","Overview"],...C.map(c=>[slug(c.type),c.name+" ("+sel(c).length+")"]),["effort","Effort & Budget"],["items","All Items"]];
function route(){const r=location.hash.slice(1)||"overview",c=C.find(c=>slug(c.type)===r);
$("#nav").innerHTML=T.map(t=>`<a href="#${t[0]}" class="${t[0]===r?"on":""}">${esc(t[1])}</a>`).join("");
const v=$("#v");v.innerHTML=c?category(c):r==="effort"?effort():r==="items"?"<div id=ls></div>":overview();
const l=$("#ls");if(l)mount(l,c?sel(c):I,!c);scrollTo(0,0)}
$("#asof").textContent="Items marked Not Required are excluded from counts";
addEventListener("hashchange",route);route();
</script></body></html>
